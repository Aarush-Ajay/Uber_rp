<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityRide - Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config.js"></script>
</head>

<body class="bg-gray-50 font-sans p-8">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-4xl font-extrabold text-emerald-700 mb-8">Organizer Dashboard</h1>

        <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-emerald-500">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Publish New Event</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Event Name</label>
                    <input type="text" id="name" placeholder="e.g. Summer Music Festival"
                        class="w-full p-3 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Venue</label>
                    <select id="venue" class="w-full p-3 border rounded-lg">
                        <option value="Wilson Garden">Wilson Garden</option>
                        <option value="Basavangudi">Basavangudi</option>
                        <option value="Koramangala">Koramangala</option>
                        <option value="Airport">Airport</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Date & Time</label>
                    <input type="datetime-local" id="time" class="w-full p-3 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Ticket Price ($)</label>
                    <input type="number" id="price" value="50" class="w-full p-3 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Total Capacity</label>
                    <input type="number" id="capacity" value="100" class="w-full p-3 border rounded-lg">
                </div>
            </div>

            <button onclick="publishNewEvent()"
                class="w-full mt-8 bg-emerald-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-emerald-700 transition">
                Publish Event
            </button>
        </div>

        <div id="success-msg"
            class="hidden mt-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-center">
            Event Published Successfully!
        </div>
    </div>

    <script>
        // Hardcoded URL to ensure it works even if config.js has issues
        const EVENT_URL = "http://127.0.0.1:8080";

        // UPDATED: Renamed function to avoid browser conflict
        async function publishNewEvent() {
            console.log("1. Button Clicked. Starting event creation...");

            // 1. Validate Inputs
            const nameInput = document.getElementById('name');
            const venueInput = document.getElementById('venue');
            const timeInput = document.getElementById('time');
            const priceInput = document.getElementById('price');
            const capacityInput = document.getElementById('capacity');

            if (!nameInput || !venueInput || !timeInput || !priceInput || !capacityInput) {
                alert("CRITICAL ERROR: One or more input fields are missing from the HTML.");
                return;
            }

            if (!timeInput.value) return alert("Please select a Date & Time.");

            // 2. Build Payload
            const payload = {
                organizer_id: "ORG-001",
                name: nameInput.value,
                venue_location: venueInput.value,
                event_time: timeInput.value + ":00Z",
                ticket_price: parseFloat(priceInput.value) || 0,
                total_capacity: parseInt(capacityInput.value) || 100,
                promo_code: "WELCOME20",
                discount_rate: 0.10,
                is_active: true
            };

            console.log("2. Sending Payload:", payload);

            // 3. Send Request
            try {
                const res = await fetch(`${EVENT_URL}/api/organizer/events`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('success-msg').classList.remove('hidden');
                    setTimeout(() => document.getElementById('success-msg').classList.add('hidden'), 3000);
                } else {
                    const err = await res.json();
                    console.error("Server Error:", err);
                    alert("Server Error: " + JSON.stringify(err));
                }
            } catch (e) {
                console.error("Connection Error:", e);
                alert("CONNECTION FAILED: Could not reach " + EVENT_URL);
            }
        }
    </script>
</body>

</html>
