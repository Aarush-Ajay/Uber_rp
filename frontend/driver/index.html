<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityRide - Driver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config.js"></script>
</head>

<body class="bg-gray-200 font-sans min-h-screen">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative">
        <div class="bg-black text-white p-6 sticky top-0 z-10">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">Driver Portal</h1>
                <div id="status-indicator" class="w-3 h-3 rounded-full bg-red-500"></div>
            </div>

            <div id="login-area" class="mt-4 space-y-2">
                <input type="text" id="driver-id" value="DRV-HUMAN" class="w-full p-2 rounded text-black"
                    placeholder="Driver ID">

                <select id="driver-location" class="w-full p-2 rounded text-black">
                    <option value="Wilson Garden">Start at Wilson Garden</option>
                    <option value="Basavangudi">Start at Basavangudi</option>
                    <option value="Koramangala">Start at Koramangala</option>
                    <option value="Airport">Start at Airport</option>
                </select>

                <button onclick="goOnline()"
                    class="w-full bg-green-600 px-4 py-2 rounded font-bold hover:bg-green-700">GO ONLINE</button>
            </div>
            <p id="welcome-msg" class="hidden mt-2 text-green-400 font-medium">You are Online looking for rides.</p>
        </div>

        <div class="p-4 space-y-4 pb-20">

            <div id="empty-state" class="text-center py-10 text-gray-500">
                <p class="text-xl">No rides available.</p>
                <p class="text-sm">Waiting for requests...</p>
            </div>

            <div id="active-ride-card"
                class="hidden bg-blue-600 text-white p-6 rounded-xl shadow-lg transform transition-all hover:scale-105">
                <h2 class="text-sm font-bold uppercase tracking-widest opacity-75 mb-2">Current Passenger</h2>
                <div class="text-3xl font-extrabold mb-4" id="ar-user">USER-123</div>

                <div class="flex items-center space-x-4 mb-6">
                    <div>
                        <p class="text-xs opacity-75">FROM</p>
                        <p class="font-bold" id="ar-from">...</p>
                    </div>
                    <div class="text-2xl">➔</div>
                    <div>
                        <p class="text-xs opacity-75">TO</p>
                        <p class="font-bold" id="ar-to">...</p>
                    </div>
                </div>

                <button onclick="completeRide()"
                    class="w-full bg-white text-blue-700 font-bold py-4 rounded-lg shadow hover:bg-gray-100">
                    COMPLETE TRIP
                </button>
            </div>

            <div id="rides-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let driverId = "";
        let currentRideId = null;
        let isOnline = false;

        async function goOnline() {
            driverId = document.getElementById('driver-id').value;
            const location = document.getElementById('driver-location').value;

            if (!driverId) return alert("Enter a Driver ID");

            // Register driver in DB
            try {
                await fetch(`${CONFIG.CORE_API}/api/register-driver`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        driver_id: driverId,
                        name: "Human Driver",
                        current_location: location // Uses the valid Enum value from dropdown
                    })
                });

                isOnline = true;
                document.getElementById('login-area').classList.add('hidden');
                document.getElementById('welcome-msg').classList.remove('hidden');
                document.getElementById('status-indicator').classList.remove('bg-red-500');
                document.getElementById('status-indicator').classList.add('bg-green-500');

                // Start Polling
                checkStatus();
                setInterval(checkStatus, 3000);

            } catch (e) { alert("Server error. Is main.py running?"); }
        }

        async function checkStatus() {
            if (!isOnline) return;

            try {
                // 1. Check if I already have a ride
                const myRideRes = await fetch(`${CONFIG.CORE_API}/api/driver/my-ride/${driverId}`);
                const myRideData = await myRideRes.json();

                if (myRideData.active_ride) {
                    showActiveRide(myRideData.active_ride);
                    return;
                }

                // 2. If no active ride, look for pending ones
                hideActiveRide();
                fetchPendingRides();
            } catch (e) { console.log("Connection error"); }
        }

        async function fetchPendingRides() {
            const res = await fetch(`${CONFIG.CORE_API}/api/driver/pending-rides`);
            const data = await res.json();
            const list = document.getElementById('rides-list');
            list.innerHTML = '';

            if (data.rides.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
            } else {
                document.getElementById('empty-state').classList.add('hidden');
                data.rides.forEach(ride => {
                    const card = `
                        <div class="bg-white p-5 rounded-lg shadow-md border-l-4 border-black flex justify-between items-center">
                            <div>
                                <p class="text-xs text-gray-500 font-bold">REQUEST #${ride.id}</p>
                                <div class="text-lg font-bold text-gray-800">${ride.from}</div>
                                <div class="text-gray-400 text-sm">to ${ride.to}</div>
                            </div>
                            <button onclick="acceptRide(${ride.id})" class="bg-black text-white px-5 py-2 rounded-full font-bold text-sm hover:bg-gray-800 shadow-lg transform hover:scale-105 transition">
                                ACCEPT
                            </button>
                        </div>`;
                    list.innerHTML += card;
                });
            }
        }

        function showActiveRide(ride) {
            currentRideId = ride.id;
            document.getElementById('active-ride-card').classList.remove('hidden');
            document.getElementById('rides-list').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            document.getElementById('ar-user').innerText = ride.user;
            document.getElementById('ar-from').innerText = ride.from;
            document.getElementById('ar-to').innerText = ride.to;
        }

        function hideActiveRide() {
            currentRideId = null;
            document.getElementById('active-ride-card').classList.add('hidden');
            document.getElementById('rides-list').classList.remove('hidden');
        }

        async function acceptRide(rideId) {
            const res = await fetch(`${CONFIG.CORE_API}/api/driver/accept-ride?ride_id=${rideId}&driver_id=${driverId}`, { method: 'POST' });
            if (res.ok) checkStatus();
            else alert("Ride taken by another driver.");
        }

        async function completeRide() {
            if (!currentRideId) return;
            const res = await fetch(`${CONFIG.CORE_API}/api/driver/complete-ride?ride_id=${currentRideId}&driver_id=${driverId}`, { method: 'POST' });
            if (res.ok) {
                alert("Ride Completed! $$$");
                checkStatus();
            }
        }
    </script>
</body>

</html>
